services:
  fregenet-db:
    image: mariadb:10.11
    container_name: fregenet-itl-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fregenet_international_db}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - fregenet_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -p\"$${MYSQL_ROOT_PASSWORD}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  fregenet_mysql_data:
